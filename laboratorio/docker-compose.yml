# Laboratorio del TP: SonarQube Community Build + PostgreSQL + herramientas de build.
#
# Basado en el ejemplo oficial de SonarSource (example-compose-files/sq-with-postgres
# del repositorio SonarSource/docker-sonarqube), con tres cambios:
#   1. Las imágenes están fijadas a una versión exacta (ver VERSIONES.md). Nunca
#      se usa "latest" ni "community": el estudio tiene que poder repetirse.
#   2. Se agrega el servicio "herramientas" (Maven + JDK) para compilar y analizar
#      el corpus siempre con la misma versión de Java, en cualquier sistema operativo.
#   3. Se desactiva el uso de mmap del motor de búsqueda interno (ver abajo).
#
# Uso (desde la raíz del repositorio):
#   docker compose -f laboratorio/docker-compose.yml --env-file laboratorio/.env up -d
#   docker compose -f laboratorio/docker-compose.yml --env-file laboratorio/.env down
# Para borrar también los datos de SonarQube (análisis, perfiles, usuarios), agregar -v al down.

name: tp-metricas

services:

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    container_name: tp-metricas-sonarqube
    hostname: sonarqube
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # El motor de búsqueda (Elasticsearch) exige vm.max_map_count >= 524288 en
      # el kernel de Docker. En Docker Desktop (Windows y macOS) el valor por
      # defecto es menor y el contenedor no arranca. Desactivar mmap evita ese
      # requisito; es la alternativa documentada para entornos de prueba y no
      # afecta las mediciones, solo el rendimiento del índice de búsqueda.
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:
      - /tmp:size=256M,mode=1777
    ports:
      - "${SONAR_PUERTO:-9000}:9000"

  db:
    image: postgres:17.11
    container_name: tp-metricas-postgres
    hostname: postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      # Credenciales internas de la red de Docker: la base no expone puertos.
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      # Hacen falta los dos montajes, como en el ejemplo oficial. La imagen
      # postgres:17 declara un volumen propio en /var/lib/postgresql/data, que es
      # donde guarda la base: si solo se monta /var/lib/postgresql, Docker crea
      # ahí un volumen anónimo que tapa al nuestro, y cada down + up arranca con
      # una base vacía (pasó el 2026-10-13: admin volvió a la contraseña de fábrica).
      - postgresql:/var/lib/postgresql
      - postgresql_data:/var/lib/postgresql/data

  # Contenedor efímero para compilar y analizar el corpus. No arranca con "up":
  # los guiones lo invocan con "docker compose run --rm herramientas ...".
  herramientas:
    image: maven:3.10.0-eclipse-temurin-21
    profiles: ["herramientas"]
    working_dir: /trabajo
    environment:
      # Dentro de la red de Compose, SonarQube se alcanza por el nombre del servicio.
      SONAR_HOST_URL: http://sonarqube:9000
      MAVEN_OPTS: "-Xmx2g"
    volumes:
      - ../trabajo:/trabajo
      # Caché de dependencias de Maven compartida entre ejecuciones: la primera
      # compilación descarga todo; las siguientes reutilizan lo descargado.
      - maven_repositorio:/root/.m2

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  postgresql:
  postgresql_data:
  maven_repositorio:
